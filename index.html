
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel File Viewer</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .upload-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: auto;
        }

        .file-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
            min-width: 0;
        }

        .file-card h2 {
            margin-top: 0;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            margin: 15px 0;
        }

        .file-name {
            color: #64748b;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .id-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 20px 0;
        }

        .id-selector label {
            font-size: 14px;
            font-weight: bold;
        }

        .id-selector select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: white;
            font-size: 14px;
            color: #1e293b;
        }

        .table-container {
            overflow: auto;
            max-height: 600px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-top: 15px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
            white-space: nowrap;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
            position: sticky;
            top: 0;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        th.selected-id {
            background: #15803d;
            color: white;
        }

        td.selected-id {
            background: #dcfce7;
            color: #166534;
        }

        tr:nth-child(even) td.selected-id {
            background: #bbf7d0;
        }

        .status {
            color: #64748b;
            font-size: 14px;
        }

        .error {
            color: #dc2626;
        }

        #merged-section {
            display: none;
            max-width: 1400px;
            margin: 30px auto 0;
            padding: 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
        }

        #merged-section h2 {
            margin-top: 0;
        }

        #merged-table {
            max-height: 700px;
        }

        #merged-table th {
            background: #0f766e;
        }

        .download-button {
            background: #0f766e;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
        }

        .download-button:hover {
            background: #115e59;
        }

        @media (max-width: 800px) {
            .upload-container {
                grid-template-columns: 1fr;
            }

            body {
                padding: 15px;
            }

            #merged-section {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <h1>Excel File Viewer</h1>
    <p class="subtitle">Upload two Excel files to view and merge their contents.</p>

    <div class="upload-container">

        <section class="file-card">
            <h2>Excel File 1</h2>
            <input type="file" id="file1" accept=".xlsx,.xls,.xlsm,.csv">
            <p class="file-name" id="name1">No file selected</p>

            <div class="id-selector">
                <label for="id1">Select Table ID Column</label>
                <select id="id1" disabled>
                    <option value="">Upload a file first</option>
                </select>
            </div>

            <p class="status" id="status1">Upload a file to begin.</p>
            <div class="table-container" id="table1"></div>
        </section>

        <section class="file-card">
            <h2>Excel File 2</h2>
            <input type="file" id="file2" accept=".xlsx,.xls,.xlsm,.csv">
            <p class="file-name" id="name2">No file selected</p>

            <div class="id-selector">
                <label for="id2">Select Table ID Column</label>
                <select id="id2" disabled>
                    <option value="">Upload a file first</option>
                </select>
            </div>

            <p class="status" id="status2">Upload a file to begin.</p>
            <div class="table-container" id="table2"></div>
        </section>

    </div>

    <section id="merged-section">
        <h2>Merged Results</h2>
        <p class="status" id="merged-status">Choose an ID column for both files.</p>
        <button type="button" class="download-button" id="download-merged">
            Download Merged XLSX
        </button>
        <div class="table-container" id="merged-table"></div>
    </section>

    <script>
        const fileData = {
            1: { headers: [], rows: [], table: null, selectedId: "" },
            2: { headers: [], rows: [], table: null, selectedId: "" }
        };

        async function loadExcelFile(input, table, name, status, idSelect, fileId) {
            const file = input.files[0];

            if (!file) return;

            name.textContent = file.name;
            status.textContent = "Reading spreadsheet...";
            status.classList.remove("error");
            table.replaceChildren();
            idSelect.replaceChildren();
            idSelect.disabled = true;

            fileData[fileId] = {
                headers: [],
                rows: [],
                table: null,
                selectedId: ""
            };

            updateMergedTable();

            try {
                const buffer = await file.arrayBuffer();
                const workbook = XLSX.read(buffer, { type: "array" });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];

                const rows = XLSX.utils.sheet_to_json(worksheet, {
                    header: 1,
                    defval: ""
                });

                if (rows.length === 0) {
                    status.textContent = "This spreadsheet is empty.";
                    updateMergedTable();
                    return;
                }

                const headers = rows[0].map(value => String(value));
                const dataRows = rows.slice(1);

                fileData[fileId].headers = headers;
                fileData[fileId].rows = dataRows;

                const htmlTable = document.createElement("table");
                const thead = document.createElement("thead");
                const tbody = document.createElement("tbody");
                const headerRow = document.createElement("tr");

                headers.forEach((value, index) => {
                    const th = document.createElement("th");
                    th.textContent = value;
                    th.dataset.column = index;
                    headerRow.appendChild(th);
                });

                thead.appendChild(headerRow);

                dataRows.forEach(row => {
                    const tr = document.createElement("tr");

                    headers.forEach((_, index) => {
                        const td = document.createElement("td");
                        td.textContent = row[index] ?? "";
                        td.dataset.column = index;
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                });

                htmlTable.append(thead, tbody);
                table.appendChild(htmlTable);

                fileData[fileId].table = htmlTable;

                const placeholder = document.createElement("option");
                placeholder.value = "";
                placeholder.textContent = "Choose a column...";
                idSelect.appendChild(placeholder);

                headers.forEach((header, index) => {
                    const option = document.createElement("option");
                    option.value = index;
                    option.textContent = header.trim() || `Column ${index + 1}`;
                    idSelect.appendChild(option);
                });

                idSelect.disabled = false;

                status.textContent =
                    `${dataRows.length} data rows | ` +
                    `${headers.length} columns | Sheet: ${sheetName}`;

            } catch (error) {
                console.error(error);
                status.textContent =
                    "Could not read this file. Try a valid Excel or CSV file.";
                status.classList.add("error");
            }

            updateMergedTable();
        }

        function highlightIdColumn(fileId, selectedColumn) {
            const data = fileData[fileId];

            if (!data.table) return;

            data.selectedId = selectedColumn;

            data.table.querySelectorAll("[data-column]").forEach(cell => {
                cell.classList.toggle(
                    "selected-id",
                    selectedColumn !== "" &&
                    cell.dataset.column === selectedColumn
                );
            });

            updateMergedTable();
        }

        function normalizeId(value) {
            if (value === null || value === undefined) return "";
            return String(value).trim();
        }

        function updateMergedTable() {
            const section = document.getElementById("merged-section");
            const mergedTable = document.getElementById("merged-table");
            const mergedStatus = document.getElementById("merged-status");

            const first = fileData[1];
            const second = fileData[2];

            mergedTable.replaceChildren();

            if (
                !first.table ||
                !second.table ||
                first.selectedId === "" ||
                second.selectedId === ""
            ) {
                section.style.display = "none";
                return;
            }

            section.style.display = "block";

            const idIndex1 = Number(first.selectedId);
            const idIndex2 = Number(second.selectedId);

            const lookup = new Map();

            second.rows.forEach(row => {
                const id = normalizeId(row[idIndex2]);

                if (id !== "" && !lookup.has(id)) {
                    lookup.set(id, row);
                }
            });

            const headers = [
                ...first.headers,
                ...second.headers
            ];

            const htmlTable = document.createElement("table");
            const thead = document.createElement("thead");
            const tbody = document.createElement("tbody");
            const headerRow = document.createElement("tr");

            headers.forEach((header, index) => {
                const th = document.createElement("th");
                th.textContent = header;
                th.title = index < first.headers.length
                    ? `File 1: ${header}`
                    : `File 2: ${header}`;
                headerRow.appendChild(th);
            });

            thead.appendChild(headerRow);

            let matchedCount = 0;
            let unmatchedCount = 0;

            first.rows.forEach(row1 => {
                const id = normalizeId(row1[idIndex1]);
                const row2 = id === "" ? undefined : lookup.get(id);

                if (row2) {
                    matchedCount++;
                } else {
                    unmatchedCount++;
                }

                const tr = document.createElement("tr");
                const combinedRow = [
                    ...first.headers.map((_, index) => row1[index] ?? ""),
                    ...second.headers.map((_, index) =>
                        row2 ? row2[index] ?? "" : ""
                    )
                ];

                combinedRow.forEach(value => {
                    const td = document.createElement("td");
                    td.textContent = value;
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

            htmlTable.append(thead, tbody);
            mergedTable.appendChild(htmlTable);

            mergedStatus.textContent =
                `${first.rows.length} total rows | ` +
                `${matchedCount} matched | ` +
                `${unmatchedCount} unmatched`;
        }

        function downloadMergedTable() {
            const first = fileData[1];
            const second = fileData[2];

            if (
                !first.table ||
                !second.table ||
                first.selectedId === "" ||
                second.selectedId === ""
            ) {
                alert("Upload both files and select an ID column for each file first.");
                return;
            }

            const mergedTable = document.querySelector("#merged-table table");

            if (!mergedTable) {
                alert("There is no merged table to download.");
                return;
            }

            const workbook = XLSX.utils.table_to_book(mergedTable, {
                sheet: "Merged Results"
            });

            XLSX.writeFile(workbook, "merged_results.xlsx");
        }

        document.getElementById("download-merged").addEventListener("click", downloadMergedTable);

        document.getElementById("file1").addEventListener("change", function () {
            loadExcelFile(
                this,
                document.getElementById("table1"),
                document.getElementById("name1"),
                document.getElementById("status1"),
                document.getElementById("id1"),
                1
            );
        });

        document.getElementById("file2").addEventListener("change", function () {
            loadExcelFile(
                this,
                document.getElementById("table2"),
                document.getElementById("name2"),
                document.getElementById("status2"),
                document.getElementById("id2"),
                2
            );
        });

        document.getElementById("id1").addEventListener("change", function () {
            highlightIdColumn(1, this.value);
        });

        document.getElementById("id2").addEventListener("change", function () {
            highlightIdColumn(2, this.value);
        });
    </script>

</body>
</html>
