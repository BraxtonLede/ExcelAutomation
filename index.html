```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel File Merger</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 30px;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .file-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px #00000015;
        }

        .file-card input {
            margin: 12px 0;
            max-width: 100%;
        }

        .id-selector {
            margin-top: 15px;
        }

        .id-selector label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        select {
            padding: 8px;
            max-width: 100%;
        }

        .status {
            color: #555;
            margin: 10px 0;
        }

        .table-container {
            overflow: auto;
            max-height: 500px;
            background: white;
            border-radius: 6px;
            margin-top: 12px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px 10px;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #e9e9e9;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .selected-id {
            background: #bbf7d0 !important;
        }

        #download-merged {
            background: #15803d;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
        }

        #download-merged:hover {
            background: #166534;
        }

        #download-merged:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #merged-section {
            margin-top: 40px;
        }

        @media (max-width: 800px) {
            body {
                margin: 15px;
            }

            .upload-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <h1>Excel File Merger</h1>

    <div class="upload-section">
        <section class="file-card">
            <h2>File 1</h2>

            <input
                type="file"
                id="file1"
                accept=".xlsx,.xls,.xlsm,.csv"
            >

            <p class="status" id="status1">Upload your first file.</p>

            <div class="id-selector">
                <label for="id1">Select File 1 ID Column</label>
                <select id="id1" disabled>
                    <option value="">Upload a file first</option>
                </select>
            </div>
        </section>

        <section class="file-card">
            <h2>File 2</h2>

            <input
                type="file"
                id="file2"
                accept=".xlsx,.xls,.xlsm,.csv"
            >

            <p class="status" id="status2">Upload your second file.</p>

            <div class="id-selector">
                <label for="id2">Select File 2 ID Column</label>
                <select id="id2" disabled>
                    <option value="">Upload a file first</option>
                </select>
            </div>
        </section>
    </div>

    <section>
        <h2>File 1 Preview</h2>
        <div class="table-container" id="table1"></div>
    </section>

    <section>
        <h2>File 2 Preview</h2>
        <div class="table-container" id="table2"></div>
    </section>

    <section id="merged-section">
        <h2>Merged Results</h2>

        <p class="status" id="merged-status">
            Upload both files and choose an ID column for each file.
        </p>

        <button
            id="download-merged"
            onclick="downloadMergedExcel()"
            disabled
        >
            Download Merged Excel (.xlsx)
        </button>

        <div class="table-container" id="merged-table"></div>
    </section>

    <script>
        const fileData = {
            1: {
                headers: [],
                rows: [],
                table: null,
                selectedId: ""
            },
            2: {
                headers: [],
                rows: [],
                table: null,
                selectedId: ""
            }
        };

        async function loadExcelFile(input, tableElement, name, statusElement, idSelect, fileId) {
            const file = input.files[0];

            if (!file) {
                return;
            }

            statusElement.textContent = "Loading file...";

            try {
                const arrayBuffer = await file.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, {
                    type: "array"
                });

                if (workbook.SheetNames.length === 0) {
                    throw new Error("The file contains no worksheets.");
                }

                const worksheet = workbook.Sheets[workbook.SheetNames[0]];

                const data = XLSX.utils.sheet_to_json(worksheet, {
                    header: 1,
                    defval: ""
                });

                if (data.length === 0) {
                    throw new Error("The worksheet is empty.");
                }

                const headers = data[0].map((header, index) =>
                    String(header).trim() || `Column ${index + 1}`
                );

                const rows = data.slice(1);

                fileData[fileId].headers = headers;
                fileData[fileId].rows = rows;
                fileData[fileId].selectedId = "";
                fileData[fileId].table = tableElement;

                buildTable(tableElement, headers, rows);
                populateIdDropdown(idSelect, headers);

                statusElement.textContent =
                    `${file.name} loaded: ${rows.length} data rows.`;

                updateMergedTable();
            } catch (error) {
                statusElement.textContent = `Error: ${error.message}`;
                tableElement.innerHTML = "";
                idSelect.innerHTML = '<option value="">Unable to load file</option>';
                idSelect.disabled = true;

                fileData[fileId] = {
                    headers: [],
                    rows: [],
                    table: null,
                    selectedId: ""
                };

                updateMergedTable();
            }
        }

        function buildTable(container, headers, rows, selectedColumn = -1) {
            container.innerHTML = "";

            const table = document.createElement("table");
            const thead = document.createElement("thead");
            const headerRow = document.createElement("tr");

            headers.forEach((header, index) => {
                const th = document.createElement("th");
                th.textContent = header;

                if (index === selectedColumn) {
                    th.classList.add("selected-id");
                }

                headerRow.appendChild(th);
            });

            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement("tbody");

            rows.forEach(row => {
                const tr = document.createElement("tr");

                headers.forEach((_, index) => {
                    const td = document.createElement("td");
                    td.textContent = row[index] ?? "";

                    if (index === selectedColumn) {
                        td.classList.add("selected-id");
                    }

                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            container.appendChild(table);
        }

        function populateIdDropdown(selectElement, headers) {
            selectElement.innerHTML = '<option value="">Choose a column</option>';

            headers.forEach((header, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = header;
                selectElement.appendChild(option);
            });

            selectElement.disabled = false;
        }

        function highlightIdColumn(fileId, selectedColumn) {
            const data = fileData[fileId];

            data.selectedId = selectedColumn;

            if (data.table) {
                buildTable(
                    data.table,
                    data.headers,
                    data.rows,
                    selectedColumn === "" ? -1 : Number(selectedColumn)
                );
            }

            updateMergedTable();
        }

        function normalizeId(value) {
            return String(value ?? "").trim();
        }

        function updateMergedTable() {
            const first = fileData[1];
            const second = fileData[2];

            const mergedSection = document.getElementById("merged-section");
            const mergedStatus = document.getElementById("merged-status");
            const mergedContainer = document.getElementById("merged-table");
            const downloadButton = document.getElementById("download-merged");

            mergedContainer.innerHTML = "";
            downloadButton.disabled = true;

            if (
                !first.table ||
                !second.table ||
                first.selectedId === "" ||
                second.selectedId === ""
            ) {
                mergedStatus.textContent =
                    "Upload both files and choose an ID column for each file.";
                return;
            }

            const idIndex1 = Number(first.selectedId);
            const idIndex2 = Number(second.selectedId);

            const lookup = new Map();

            second.rows.forEach(row => {
                const id = normalizeId(row[idIndex2]);

                if (id !== "" && !lookup.has(id)) {
                    lookup.set(id, row);
                }
            });

            const mergedHeaders = [
                ...first.headers,
                ...second.headers
            ];

            let matched = 0;
            let unmatched = 0;

            const mergedRows = first.rows.map(row1 => {
                const id = normalizeId(row1[idIndex1]);
                const row2 = id === "" ? undefined : lookup.get(id);

                if (row2) {
                    matched++;
                } else {
                    unmatched++;
                }

                return [
                    ...first.headers.map((_, index) => row1[index] ?? ""),
                    ...second.headers.map((_, index) =>
                        row2 ? row2[index] ?? "" : ""
                    )
                ];
            });

            buildTable(
                mergedContainer,
                mergedHeaders,
                mergedRows,
                -1
            );

            mergedStatus.textContent =
                `Total rows: ${mergedRows.length} | Matched: ${matched} | Unmatched: ${unmatched}`;

            downloadButton.disabled = false;
        }

        function downloadMergedExcel() {
            const first = fileData[1];
            const second = fileData[2];

            if (
                !first.table ||
                !second.table ||
                first.selectedId === "" ||
                second.selectedId === ""
            ) {
                alert("Please upload both files and select both ID columns.");
                return;
            }

            const idIndex1 = Number(first.selectedId);
            const idIndex2 = Number(second.selectedId);
            const lookup = new Map();

            second.rows.forEach(row => {
                const id = normalizeId(row[idIndex2]);

                if (id !== "" && !lookup.has(id)) {
                    lookup.set(id, row);
                }
            });

            const headers = [
                ...first.headers,
                ...second.headers
            ];

            const mergedRows = first.rows.map(row1 => {
                const id = normalizeId(row1[idIndex1]);
                const row2 = id === "" ? undefined : lookup.get(id);

                return [
                    ...first.headers.map((_, index) => row1[index] ?? ""),
                    ...second.headers.map((_, index) =>
                        row2 ? row2[index] ?? "" : ""
                    )
                ];
            });

            const worksheet = XLSX.utils.aoa_to_sheet([
                headers,
                ...mergedRows
            ]);

            const workbook = XLSX.utils.book_new();

            XLSX.utils.book_append_sheet(
                workbook,
                worksheet,
                "Merged Results"
            );

            XLSX.writeFile(workbook, "merged_results.xlsx");
        }

        document.getElementById("file1").addEventListener("change", event => {
            loadExcelFile(
                event.target,
                document.getElementById("table1"),
                "File 1",
                document.getElementById("status1"),
                document.getElementById("id1"),
                1
            );
        });

        document.getElementById("file2").addEventListener("change", event => {
            loadExcelFile(
                event.target,
                document.getElementById("table2"),
                "File 2",
                document.getElementById("status2"),
                document.getElementById("id2"),
                2
            );
        });

        document.getElementById("id1").addEventListener("change", event => {
            highlightIdColumn(1, event.target.value);
        });

        document.getElementById("id2").addEventListener("change", event => {
            highlightIdColumn(2, event.target.value);
        });
    </script>
</body>
</html>
